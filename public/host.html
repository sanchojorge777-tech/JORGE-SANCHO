<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Host · Boardroom Quiz</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A101E">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preload" href="fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body class="host">
<header class="topbar">
  <div class="brand"><img class="logo" src="img/logo.svg" alt="" width="32" height="32"><span id="appname">Boardroom Quiz</span></div>
  <div class="top-info" id="topinfo"></div>
  <div class="top-actions">
    <span class="conn" id="status" role="status" hidden><i></i>Reconnecting…</span>
    <button class="btn ghost small" id="fs" type="button">Fullscreen</button>
  </div>
</header>
<main id="stage" aria-live="polite"></main>
<footer id="ctl" class="ctl"></footer>
<noscript><p class="lead" style="padding:1rem">This app needs JavaScript.</p></noscript>
<script src="vendor/qrcode.js"></script>
<script type="module" src="js/host.js"></script>
</body>
</html>
